plugins { id 'eclipse'; id 'idea'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = mod_version
group = mod_group
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: minecraft_version
 runs {
  configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { randombox { source sourceSets.main } } }
  client {}
  server { args '--nogui' }
 }
}
repositories { maven { url = 'https://maven.neoforged.net/releases' } }
dependencies { minecraft "net.neoforged:forge:${neoforge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title':'Random Box','Specification-Vendor':'Arena.ai','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version,'Implementation-Vendor':'Arena.ai']) } finalizedBy 'reobfJar' }
