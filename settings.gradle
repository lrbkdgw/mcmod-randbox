pluginManagement {
    repositories { maven { url = 'https://maven.neoforged.net/releases' }; gradlePluginPortal(); mavenCentral() }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'net.neoforged.gradle.userdev') useModule("net.neoforged.gradle:userdev:${requested.version}") } }
}
plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0' }
rootProject.name='randombox'
