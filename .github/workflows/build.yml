name: Build mod

on:
  push:
    branches:
      - 'arena/**'
      - main
    paths-ignore:
      - 'dist/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: List artifacts
        run: ls -l build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: randombox-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit the built jar into dist/
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/*.jar dist/
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "CI: build artifacts [skip ci]"
            git push
          else
            echo "dist/ unchanged"
          fi
