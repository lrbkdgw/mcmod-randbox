name: Build mod

on:
  push:
    branches:
      - 'arena/**'
      - main
    paths-ignore:
      - 'dist/**'
      - 'ci-logs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee /tmp/build.log

      - name: List artifacts
        if: always()
        run: ls -l build/libs || true

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: randombox-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # The sandbox this repository is developed in cannot download Actions logs,
      # so the build output is committed back to the branch.
      - name: Publish build log and jar to the branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p ci-logs dist
          tail -c 250000 /tmp/build.log > ci-logs/build.log || true
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            rm -f dist/*.jar
            cp build/libs/*.jar dist/ || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs dist
          if [ -n "$(git status --porcelain ci-logs dist)" ]; then
            git commit -m "CI: build output [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Fail when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
