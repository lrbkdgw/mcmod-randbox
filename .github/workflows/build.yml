name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - shell: bash
        run: |
          set +e
          gradle build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^.*error:|^FAILURE:|^\* What went wrong:|^Execution failed' build.log | tail -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: randombox-neoforge-1.20.1
          path: |
            build/libs/*.jar
            build.log
