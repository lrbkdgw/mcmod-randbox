name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            grep -E -A 5 'src/main/java/.*error:|FAILURE:|What went wrong:|Execution failed for task' build.log > failure-summary.log || true
            message=$(head -c 3500 failure-summary.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$message"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: lootroulette-1.20.1
          path: build/libs/*.jar
